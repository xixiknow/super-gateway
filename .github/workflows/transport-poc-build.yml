name: transport-poc-binaries

on:
  push:
    branches: [main]
    paths:
      - "transport-poc/**"
      - ".github/workflows/transport-poc-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: transport-poc-binaries-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - target: x86_64-pc-windows-msvc
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: transport-poc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: transport-poc
      - name: Install BoringSSL build dependencies
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install --yes --no-install-recommends
          clang cmake libclang-dev nasm ninja-build perl pkg-config
      - name: Install NASM
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command nasm -ErrorAction SilentlyContinue)) {
            choco install nasm -y --no-progress
            Add-Content $env:GITHUB_PATH 'C:\Program Files\NASM'
          }
      - name: Build release binaries
        run: cargo build --release --locked --target ${{ matrix.target }} --all-features
      - name: Collect binaries
        shell: bash
        run: |
          set -euo pipefail
          staging="${RUNNER_TEMP}/transport-poc-${{ matrix.target }}"
          mkdir -p "$staging"
          for bin in spike-cli claude-capture-runner transport-matrix capture-endpoint subscription-response-probe runtime-load; do
            found=""
            for candidate in "target/${{ matrix.target }}/release/$bin" "target/${{ matrix.target }}/release/$bin.exe"; do
              if [ -f "$candidate" ]; then
                cp "$candidate" "$staging/"
                found=1
                break
              fi
            done
            if [ -z "$found" ]; then
              echo "::warning::binary $bin was not produced"
            fi
          done
          ls -la "$staging"
          cd "$staging"
          tar -czf "${RUNNER_TEMP}/transport-poc-${{ matrix.target }}.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: transport-poc-binaries-${{ matrix.target }}
          path: ${{ runner.temp }}/transport-poc-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          retention-days: 90

[workspace]
members = [
    "crates/gateway-domain",
    "crates/gateway-policy",
    "crates/gateway-scheduler",
    "crates/gateway-transport",
    "crates/gateway-storage",
    "crates/gateway-services",
    "crates/gateway-api",
    "crates/gateway-testkit",
    "crates/super-gatewayd",
]
exclude = ["transport-poc", "open-project", "claude-code-decompiler"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
aes-gcm = "0.11.1"
arc-swap = "1.9.2"
anyhow = "1.0.104"
argon2 = "0.5.3"
async-trait = "0.1.89"
axum = { version = "0.8.9", features = ["http1", "http2", "json", "tokio"] }
base64 = "0.22.1"
boring = "5.2.0"
bytes = "1.12.1"
ed25519-dalek = "2.2.0"
dotenvy = "0.15.7"
flate2 = { version = "1.1.9", default-features = false, features = ["rust_backend"] }
futures-core = "0.3.31"
getrandom = "0.3.4"
hmac = "0.12.1"
http = "1.5.0"
http-body-util = "0.1.5"
httparse = "1.10.1"
ipnet = { version = "2.11.0", features = ["serde"] }
mime_guess = "2.0.5"
rand = "0.9.2"
rust-embed = "8.7.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_urlencoded = "0.7.1"
serde_jcs = "0.2.0"
semver = "1.0.27"
sha2 = "0.10.9"
sha1 = "0.10.6"
sqlx = { version = "0.8.6", default-features = false, features = ["derive", "json", "macros", "migrate", "postgres", "runtime-tokio-rustls", "uuid"] }
subtle = "2.6.1"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-boring = "5.2.0"
tokio-util = { version = "0.7.19", features = ["rt"] }
tower = { version = "0.5.3", features = ["util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "json"] }
uuid = { version = "1.24.1", features = ["serde", "v4", "v7"] }
zeroize = "1.9.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
dbg_macro = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"

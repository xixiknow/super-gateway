global
  stats socket /run/haproxy/admin.sock mode 660 level admin
  log stdout format raw local0

defaults
  mode http
  option httplog
  option http-keep-alive
  timeout connect 5s
  timeout client 150s
  timeout server 150s

frontend public
  bind :8080
  default_backend gateway_active

backend gateway_active
  option httpchk GET /readyz
  http-check expect status 200
  option http-keep-alive
  server blue gateway_blue:8080 check inter 2s fall 3 rise 2
  server green gateway_green:8080 check inter 2s fall 3 rise 2 disabled

frontend admin
  bind :8081
  default_backend gateway_admin

backend gateway_admin
  option httpchk GET /readyz
  http-check expect status 200
  server blue gateway_blue:8081 check inter 2s fall 3 rise 2
  server green gateway_green:8081 check inter 2s fall 3 rise 2 disabled

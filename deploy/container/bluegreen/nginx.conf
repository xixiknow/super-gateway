events {}

http {
  upstream super_gateway_active {
    server gateway_blue:8080;
    keepalive 128;
  }
  upstream super_gateway_admin {
    server gateway_blue:8081;
    keepalive 32;
  }
  server {
    listen 8080;
    location / {
      proxy_pass http://super_gateway_active;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_buffering off;
      proxy_request_buffering off;
      proxy_cache off;
      gzip off;
      proxy_read_timeout 150s;
      proxy_send_timeout 150s;
      send_timeout 150s;
    }
  }
  server {
    listen 8081;
    location / {
      proxy_pass http://super_gateway_admin;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_buffering off;
      proxy_request_buffering off;
      proxy_read_timeout 150s;
      proxy_send_timeout 150s;
      send_timeout 150s;
    }
  }
}

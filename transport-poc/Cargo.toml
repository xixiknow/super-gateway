[workspace]
members = [
    "crates/capture-schema",
    "crates/wire-normalizer",
    "crates/wire-diff",
    "crates/archetype-bundle",
    "crates/transport-core",
    "crates/tls-tap",
    "crates/controlled-h2-capture",
    "crates/transport-runtime-lab",
    "crates/transport-matrix",
    "crates/capture-endpoint",
    "crates/claude-capture-runner",
    "crates/subscription-response-probe",
    "crates/spike-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
anyhow = "1.0"
base64 = "0.22"
boring = "5.2"
bytes = "1.12"
axum = { version = "0.8", features = ["http2", "json", "tokio"] }
clap = { version = "4.5", features = ["derive", "env"] }
hex = "0.4"
percent-encoding = "2.3"
rustls-native-certs = "0.8"
futures-util = "=0.3.31"
h2 = "0.4"
http = "1.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
subtle = "2.6"
tempfile = "3.20"
thiserror = "2.0"
tokio = { version = "1.47", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-boring = "5.2"
tokio-util = { version = "0.7", features = ["rt"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1.18", features = ["serde", "v4"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
